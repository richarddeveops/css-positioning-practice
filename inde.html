<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scene.css">
    <title>Positioned Elements</title>
</head>
<body>
    <header>
        <p><a href="index.html">Back to positioning lesson</a></p>
        <h1>Positioned Elements</h1>
    </header>
    <main>
        <section class="scene" aria-label="An image with colored markers positioned around it">
            <img class="scene-image" src="asset/piqsels.com-id-fvkig.jpg" alt="Image used for positioning practice">
            <span class="marker marker-one" aria-hidden="true"></span>
            <span class="marker marker-two" aria-hidden="true"></span>
            <span class="marker marker-three" aria-hidden="true"></span>
            <span class="marker marker-four" aria-hidden="true"></span>
            <span class="marker marker-five" aria-hidden="true"></span>
            <span class="marker marker-six" aria-hidden="true"></span>
            <span class="marker marker-seven" aria-hidden="true"></span>
            <span class="marker marker-eight" aria-hidden="true"></span>
        </section>
    </main>
</body>
</html>
